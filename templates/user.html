<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">User Dashboard</a>
        <div>
            <span class="navbar-text me-3">Hello, {{ username }}</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center p-4">
                <h2 class="mb-3">Welcome, {{ username }}!</h2>
                <p class="lead">Your role: 
                    {% if role == 'admin' %}
                        <span class="badge bg-primary">{{ role }}</span>
                    {% else %}
                        <span class="badge bg-success">{{ role }}</span>
                    {% endif %}
                </p>
                <p class="mt-3">This is your personal dashboard. You can explore the features allowed for your role.</p>
                <a href="/" class="btn btn-primary mt-3" style="width: 140px;">Go Home</a>
                <a href="/change_password" class="btn btn-secondary mt-3 ms-2" style="width: 140px;">Change Password</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
